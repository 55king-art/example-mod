name: Build Geode Mod

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Android Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          android-ndk-version: 26.3.11579264
